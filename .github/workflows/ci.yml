name: KisanConnect CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test-user-service:
    name: Test · User Service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: temurin, cache: maven }
      - run: ./mvnw test -Dspring.profiles.active=test --no-transfer-progress
        working-directory: backend/user-service

  test-product-service:
    name: Test · Product Service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: temurin, cache: maven }
      - run: ./mvnw test -Dspring.profiles.active=test --no-transfer-progress
        working-directory: backend/product-service

  test-order-service:
    name: Test · Order Service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: temurin, cache: maven }
      - run: ./mvnw test -Dspring.profiles.active=test --no-transfer-progress
        working-directory: backend/order-service

  test-frontend:
    name: Test · Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '18' }
      - run: npm ci && npm run build
        working-directory: frontend
        env:
          CI: false
          REACT_APP_USER_SERVICE_URL: http://localhost:8081
          REACT_APP_PRODUCT_SERVICE_URL: http://localhost:8082
          REACT_APP_ORDER_SERVICE_URL: http://localhost:8083

  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    needs: [test-user-service, test-product-service, test-order-service, test-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy all services
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          for svc in user-service product-service order-service notification-service; do
            echo "Deploying $svc..."
            cd backend/$svc
            fly deploy --app kc-$svc --ha=false --remote-only
            cd ../..
          done
