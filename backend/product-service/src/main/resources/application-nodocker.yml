server:
  port: ${PORT:8082}

spring:
  datasource:
    url: jdbc:h2:file:./data/kisanconnect;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        default_schema: product_svc
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: false
  flyway:
    enabled: false
  h2:
    console:
      enabled: true
      path: /h2-console
  kafka:
    bootstrap-servers: localhost:9092

jwt:
  secret: kisanconnect-local-secret-key-change-in-prod-at-least-32-chars

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.kisanconnect: DEBUG
    org.apache.kafka: WARN
