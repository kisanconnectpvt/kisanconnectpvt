# KisanConnect — notification-service Fly.io config
# Deploy: fly deploy --config fly.toml (from backend/notification-service/ directory)

app = "kc-notification-service"
primary_region = "sin"   # Singapore — closest to India

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8084"
  JAVA_OPTS = "-Xmx400m -Xms200m"

[http_service]
  internal_port = 8084
  force_https   = true
  auto_stop_machines  = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period  = "60s"
    interval      = "15s"
    method        = "GET"
    path          = "/actuator/health"
    timeout       = "10s"

[[vm]]
  size   = "shared-cpu-1x"
  memory = "512mb"
