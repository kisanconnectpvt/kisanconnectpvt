version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: kc-postgres
    environment:
      POSTGRES_USER: kcuser
      POSTGRES_PASSWORD: kcpass
      POSTGRES_DB: kisanconnect
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U kcuser -d kisanconnect"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: kc-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kc-kafka
    depends_on: [zookeeper]
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kc-kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD","kafka-broker-api-versions","--bootstrap-server","localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kc-kafka-ui
    depends_on: [kafka]
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kc-kafka:29092

  redis:
    image: redis:7-alpine
    container_name: kc-redis
    ports:
      - "6379:6379"

  user-service:
    build:
      context: ./backend/user-service
      dockerfile: Dockerfile
    container_name: kc-user-service
    env_file: .env.local
    depends_on:
      - postgres
      - kafka
    ports:
      - "8081:8081"

  product-service:
    build:
      context: ./backend/product-service
      dockerfile: Dockerfile
    container_name: kc-product-service
    env_file: .env.local
    depends_on:
      - postgres
      - kafka
    ports:
      - "8082:8082"

  order-service:
    build:
      context: ./backend/order-service
      dockerfile: Dockerfile
    container_name: kc-order-service
    env_file: .env.local
    depends_on:
      - postgres
      - kafka
    ports:
      - "8083:8083"

  notification-service:
    build:
      context: ./backend/notification-service
      dockerfile: Dockerfile
    container_name: kc-notification-service
    env_file: .env.local
    depends_on:
      - kafka
    ports:
      - "8084:8084"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kc-frontend
    env_file: .env.local
    ports:
      - "3000:80"

volumes:
  postgres_data:
