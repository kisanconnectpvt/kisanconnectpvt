apiVersion: apps/v1
kind: Deployment
metadata:
  name: kc-zookeeper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kc-zookeeper
  template:
    metadata:
      labels:
        app: kc-zookeeper
    spec:
      containers:
      - name: zookeeper
        image: bitnami/zookeeper:3.9
        env:
        - name: ALLOW_ANONYMOUS_LOGIN
          value: "yes"
        ports:
        - containerPort: 2181

---
apiVersion: v1
kind: Service
metadata:
  name: kc-zookeeper
spec:
  selector:
    app: kc-zookeeper
  ports:
  - port: 2181
    targetPort: 2181
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kc-kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kc-kafka
  template:
    metadata:
      labels:
        app: kc-kafka
    spec:
      containers:
      - name: kafka
        image: bitnami/kafka:3.5
        env:
        - name: KAFKA_CFG_ZOOKEEPER_CONNECT
          value: "kc-zookeeper:2181"
        - name: KAFKA_CFG_LISTENERS
          value: "PLAINTEXT://:9092,PLAINTEXT_INTERNAL://:29092"
        - name: KAFKA_CFG_ADVERTISED_LISTENERS
          value: "PLAINTEXT://kc-kafka:9092,PLAINTEXT_INTERNAL://kc-kafka:29092"
        - name: KAFKA_CFG_INTER_BROKER_LISTENER_NAME
          value: "PLAINTEXT_INTERNAL"
        - name: ALLOW_PLAINTEXT_LISTENER
          value: "yes"
        ports:
        - containerPort: 9092
        - containerPort: 29092

---
apiVersion: v1
kind: Service
metadata:
  name: kc-kafka
spec:
  selector:
    app: kc-kafka
  ports:
  - name: external
    port: 9092
    targetPort: 9092
  - name: internal
    port: 29092
    targetPort: 29092
  type: ClusterIP
