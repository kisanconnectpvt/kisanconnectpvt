apiVersion: v1
kind: Service
metadata:
  name: kc-frontend
spec:
  type: NodePort
  selector:
    app: kc-frontend
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kc-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kc-frontend
  template:
    metadata:
      labels:
        app: kc-frontend
    spec:
      containers:
      - name: frontend
        image: kisanconnect/frontend:local
        ports:
        - containerPort: 80
        envFrom:
        - configMapRef:
            name: kisan-config
        - secretRef:
            name: kisan-secret
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10

---
# User service
apiVersion: v1
kind: Service
metadata:
  name: kc-user-service
spec:
  ports:
  - port: 8081
    targetPort: 8081
  selector:
    app: kc-user-service
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kc-user-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kc-user-service
  template:
    metadata:
      labels:
        app: kc-user-service
    spec:
      containers:
      - name: user-service
        image: kisanconnect/user-service:local
        ports:
        - containerPort: 8081
        envFrom:
        - configMapRef:
            name: kisan-config
        - secretRef:
            name: kisan-secret
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 10

